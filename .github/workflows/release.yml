name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Release Tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref for release: ${{ github.ref }}" >&2
            exit 1
          fi

  build-windows:
    name: Package Windows x64
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install pinned wgpu-native (Windows x64 gnu)
        # Runtime links wgpu-native; release must provision the same pinned SDK as CI/local builds.
        run: python3 tools/wgpu/install_wgpu.py --target windows-x86_64-gnu --output .deps/wgpu-native
      - name: Build Windows x64 (ReleaseSafe)
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe
      - name: Stage Windows release archive
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="dist/zengy-${TAG}-x86_64-windows"
          mkdir -p "$STAGE/include"
          cp zig-out/bin/zengy.exe zig-out/bin/zengy-runtime.exe "$STAGE/"
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x64.zip" -o /tmp/sdl3.zip
          unzip -j -o /tmp/sdl3.zip "SDL3.dll" -d "$STAGE/"
          cp .deps/wgpu-native/lib/wgpu_native.dll "$STAGE/"
          if [ -f .deps/wgpu-native/LICENSE ]; then cp .deps/wgpu-native/LICENSE "$STAGE/LICENSE-wgpu-native"; fi
          if [ -f .deps/wgpu-native/zengy-wgpu-version.txt ]; then cp .deps/wgpu-native/zengy-wgpu-version.txt "$STAGE/"; fi
          cp include/engine_extension.h "$STAGE/include/"
          cp README.md LICENSE "$STAGE/"
          (cd dist && zip -r "zengy-${TAG}-x86_64-windows.zip" "zengy-${TAG}-x86_64-windows")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/*.zip

  build-linux:
    name: Package Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Run tests & build Linux x64 CLI (ReleaseSafe)
        # The CLI does not link SDL3. The runtime and demos do, so they are not part of the Linux
        # bundle: on Linux, install SDL3 from your package manager to build them yourself.
        run: |
          zig build test -Doptimize=ReleaseSafe
          zig build cli -Doptimize=ReleaseSafe
      - name: Stage Linux release archive
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="dist/zengy-${TAG}-x86_64-linux"
          mkdir -p "$STAGE/include"
          cp zig-out/bin/zengy "$STAGE/"
          cp include/engine_extension.h "$STAGE/include/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/zengy-${TAG}-x86_64-linux.tar.gz" -C dist "zengy-${TAG}-x86_64-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: dist/*.tar.gz

  build-macos:
    name: Package macOS arm64
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install SDL3 via Homebrew
        run: brew install sdl3
      - name: Install pinned wgpu-native (macOS arm64)
        run: python3 tools/wgpu/install_wgpu.py --target macos-aarch64 --output .deps/wgpu-native
      - name: Build macOS arm64 CLI & runtime (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Stage macOS release archive
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="dist/zengy-${TAG}-arm64-macos"
          mkdir -p "$STAGE/include"
          cp zig-out/bin/zengy zig-out/bin/zengy-runtime "$STAGE/"
          SDL3_PREFIX="$(brew --prefix sdl3)"
          cp -L "$SDL3_PREFIX/lib/libSDL3.0.dylib" "$STAGE/libSDL3.0.dylib"
          chmod 755 "$STAGE/libSDL3.0.dylib"
          install_name_tool -id "@rpath/libSDL3.0.dylib" "$STAGE/libSDL3.0.dylib"
          SDL3_DEP="$(otool -L "$STAGE/zengy-runtime" | awk '/libSDL3/{print $1; exit}')"
          if [ -n "$SDL3_DEP" ]; then
            install_name_tool -change "$SDL3_DEP" "@executable_path/libSDL3.0.dylib" "$STAGE/zengy-runtime"
          fi
          # Bundle wgpu-native next to the runtime (name varies by SDK layout).
          WGPU_LIB="$(find .deps/wgpu-native/lib -maxdepth 1 \( -name 'libwgpu_native*.dylib' -o -name 'wgpu_native*.dylib' \) | head -n 1)"
          if [ -z "$WGPU_LIB" ]; then
            echo "wgpu-native dylib missing under .deps/wgpu-native/lib" >&2
            ls -la .deps/wgpu-native/lib >&2 || true
            exit 1
          fi
          cp -L "$WGPU_LIB" "$STAGE/libwgpu_native.dylib"
          chmod 755 "$STAGE/libwgpu_native.dylib"
          install_name_tool -id "@executable_path/libwgpu_native.dylib" "$STAGE/libwgpu_native.dylib"
          WGPU_DEP="$(otool -L "$STAGE/zengy-runtime" | awk '/wgpu/{print $1; exit}')"
          if [ -n "$WGPU_DEP" ]; then
            install_name_tool -change "$WGPU_DEP" "@executable_path/libwgpu_native.dylib" "$STAGE/zengy-runtime"
          fi
          codesign --force --sign - "$STAGE/libSDL3.0.dylib"
          codesign --force --sign - "$STAGE/libwgpu_native.dylib"
          codesign --force --sign - "$STAGE/zengy-runtime"
          otool -L "$STAGE/zengy-runtime"
          if [ -f .deps/wgpu-native/LICENSE ]; then cp .deps/wgpu-native/LICENSE "$STAGE/LICENSE-wgpu-native"; fi
          if [ -f .deps/wgpu-native/zengy-wgpu-version.txt ]; then cp .deps/wgpu-native/zengy-wgpu-version.txt "$STAGE/"; fi
          cp include/engine_extension.h "$STAGE/include/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/zengy-${TAG}-arm64-macos.tar.gz" -C dist "zengy-${TAG}-arm64-macos"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-bundle
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [ meta, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/windows-x64-bundle/*.zip
            artifacts/linux-x64-bundle/*.tar.gz
            artifacts/macos-arm64-bundle/*.tar.gz
