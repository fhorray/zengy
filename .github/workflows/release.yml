name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Release Tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref for release: ${{ github.ref }}" >&2
            exit 1
          fi

  build-windows:
    name: Package Windows x64
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build Windows x64 (ReleaseSafe)
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe
      - name: Stage Windows release archive
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="dist/zigeng-${TAG}-x86_64-windows"
          mkdir -p "$STAGE/include"
          cp zig-out/bin/zigeng.exe zig-out/bin/zigeng-runtime.exe "$STAGE/"
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x64.zip" -o /tmp/sdl3.zip
          unzip -j -o /tmp/sdl3.zip "SDL3.dll" -d "$STAGE/"
          cp include/engine_extension.h "$STAGE/include/"
          cp README.md LICENSE "$STAGE/"
          (cd dist && zip -r "zigeng-${TAG}-x86_64-windows.zip" "zigeng-${TAG}-x86_64-windows")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/*.zip

  build-linux:
    name: Package Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Run tests & build Linux x64 CLI (ReleaseSafe)
        run: |
          zig build test -Doptimize=ReleaseSafe
          zig build install -Doptimize=ReleaseSafe || true
      - name: Stage Linux release archive
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="dist/zigeng-${TAG}-x86_64-linux"
          mkdir -p "$STAGE/include"
          cp zig-out/bin/zigeng zig-out/bin/zigeng-runtime "$STAGE/"
          cp include/engine_extension.h "$STAGE/include/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/zigeng-${TAG}-x86_64-linux.tar.gz" -C dist "zigeng-${TAG}-x86_64-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [ meta, build-windows, build-linux ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/windows-x64-bundle/*.zip
            artifacts/linux-x64-bundle/*.tar.gz
