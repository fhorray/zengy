name: wgpu foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/graphics/wgpu/**'
      - 'tools/wgpu/**'
      - 'examples/visual-wgpu/**'
      - 'packages/window/sdl3/**'
      - 'packages/render/**'
      - 'packages/graphics/core/**'
      - 'build.zig'
      - '.github/workflows/wgpu-foundation.yml'
  pull_request:
    paths:
      - 'packages/graphics/wgpu/**'
      - 'tools/wgpu/**'
      - 'examples/visual-wgpu/**'
      - 'packages/window/sdl3/**'
      - 'packages/render/**'
      - 'packages/graphics/core/**'
      - 'build.zig'
      - '.github/workflows/wgpu-foundation.yml'
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shader candidate transformations
        run: python -m unittest discover -s tools/wgpu -p 'test_*.py' -v
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install pinned native SDK
        run: python tools/wgpu/install_wgpu.py --output .deps/wgpu-native
      - name: Compile and link every example on the wgpu stack
        shell: pwsh
        run: |
          $root = (Resolve-Path .deps/wgpu-native).Path
          zig build build-wgpu-examples "-Dwgpu-root=$root" -Doptimize=ReleaseSafe
      - name: GPU conformance tests (skipped when the runner has no adapter)
        shell: pwsh
        run: |
          $root = (Resolve-Path .deps/wgpu-native).Path
          zig build test-wgpu-gpu "-Dwgpu-root=$root"
